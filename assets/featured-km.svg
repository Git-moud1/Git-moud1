<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="Featured project: KM — maths e-learning platform">
<title>Featured project: KM</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050A16"/>
    <stop offset="1" stop-color="#0F1D38"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#38BDF8"/>
    <stop offset="1" stop-color="#818CF8"/>
  </linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E0F2FE"/>
    <stop offset="0.5" stop-color="#7DD3FC"/>
    <stop offset="1" stop-color="#818CF8"/>
  </linearGradient>
  <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#1D4ED8" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  <clipPath id="frame"><rect width="800" height="240" rx="20"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="800" height="240" fill="url(#bg)"/>
  <ellipse cx="680" cy="60" rx="260" ry="160" fill="url(#orb)" filter="url(#soft)"/>

  <!-- decorative formula, right side -->
  <g font-family="'Cambria Math', 'STIX Two Math', 'Times New Roman', serif" font-style="italic" fill="#7DD3FC" opacity="0.18">
    <text x="500" y="84" font-size="30">f(x) = ax² + bx + c</text>
    <text x="610" y="136" font-size="28">∫₀¹ x dx = ½</text>
    <text x="600" y="186" font-size="26">Δ = b² − 4ac</text>
  </g>

  <rect x="40" y="34" width="196" height="38" rx="19" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.5"/>
  <circle cx="62" cy="53" r="5.5" fill="#38BDF8">
    <animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="78" y="59.5" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="2" fill="#7DD3FC">FEATURED</text>

  <text x="38" y="152" font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#title)">K.M</text>
  <text x="40" y="200" font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="#E6EDF5">Mathematics e-learning platform</text>
</g>
<rect x="1" y="1" width="798" height="238" rx="19" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity="0.8"/>
</svg>
