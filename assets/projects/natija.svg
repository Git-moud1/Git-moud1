<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="Natija — National exam results">
<title>Natija — National exam results</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#04180E"/>
    <stop offset="1" stop-color="#0A2417"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#12945A"/>
    <stop offset="1" stop-color="#FFD343"/>
  </linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F2F7F0"/>
    <stop offset="0.5" stop-color="#7FD0A6"/>
    <stop offset="1" stop-color="#FFD343"/>
  </linearGradient>
  <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#12945A" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#12945A" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  <clipPath id="frame"><rect width="800" height="240" rx="20"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="800" height="240" fill="url(#bg)"/>
  <ellipse cx="680" cy="60" rx="260" ry="160" fill="url(#orb)" filter="url(#soft)"/>

  <!-- decoration, right side -->
  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#FFD343" opacity="0.18">
    <text x="560" y="92" font-size="44">نتيجة</text>
    <text x="560" y="140" font-size="26">BAC · BEPC · 1AS</text>
    <text x="590" y="188" font-size="26">121 000 rows</text>
  </g>

  <rect x="40" y="34" width="222" height="38" rx="19" fill="#FFD343" fill-opacity="0.12" stroke="#FFD343" stroke-opacity="0.5"/>
  <circle cx="62" cy="53" r="5.5" fill="#FFD343">
    <animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="78" y="59.5" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="2" fill="#FFE08A">EXAM RESULTS</text>

  <text x="38" y="152" font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#title)">Natija</text>
  <text x="40" y="200" font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="#F2F7F0">National exam results</text>
</g>
<rect x="1" y="1" width="798" height="238" rx="19" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity="0.8"/>
</svg>
