<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="Mauri-Dev — Trilingual team portfolio">
<title>Mauri-Dev — Trilingual team portfolio</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B0C10"/>
    <stop offset="1" stop-color="#1C1F27"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#A78BFA"/>
    <stop offset="1" stop-color="#60A5FA"/>
  </linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#EDEFF6"/>
    <stop offset="0.5" stop-color="#A78BFA"/>
    <stop offset="1" stop-color="#60A5FA"/>
  </linearGradient>
  <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  <clipPath id="frame"><rect width="800" height="240" rx="20"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="800" height="240" fill="url(#bg)"/>
  <ellipse cx="680" cy="60" rx="260" ry="160" fill="url(#orb)" filter="url(#soft)"/>

  <!-- decoration, right side -->
  <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" fill="#A78BFA" opacity="0.18">
    <text x="560" y="84" font-size="30">&lt;/&gt;</text>
    <text x="580" y="136" font-size="26">AR · EN · FR</text>
    <text x="528" y="186" font-size="22">next@16 · react@19</text>
  </g>

  <rect x="40" y="34" width="196" height="38" rx="19" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.5"/>
  <circle cx="62" cy="53" r="5.5" fill="#A78BFA">
    <animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="78" y="59.5" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="2" fill="#C4B5FD">PORTFOLIO</text>

  <text x="38" y="152" font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#title)">Mauri-Dev</text>
  <text x="40" y="200" font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="#EDEFF6">Trilingual team portfolio</text>
</g>
<rect x="1" y="1" width="798" height="238" rx="19" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity="0.8"/>
</svg>
