<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="Skin Beauty — Korean skincare store">
<title>Skin Beauty — Korean skincare store</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#161D3F"/>
    <stop offset="1" stop-color="#1F295A"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FF6FA1"/>
    <stop offset="1" stop-color="#8A9CDD"/>
  </linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFF7FB"/>
    <stop offset="0.5" stop-color="#FFA6C4"/>
    <stop offset="1" stop-color="#F43F85"/>
  </linearGradient>
  <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#E11D6D" stop-opacity="0.3"/>
    <stop offset="1" stop-color="#E11D6D" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  <clipPath id="frame"><rect width="800" height="240" rx="20"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="800" height="240" fill="url(#bg)"/>
  <ellipse cx="680" cy="60" rx="260" ry="160" fill="url(#orb)" filter="url(#soft)"/>

  <!-- decoration, right side -->
  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#FFA6C4" opacity="0.18">
    <text x="600" y="92" font-size="40">뷰티</text>
    <text x="600" y="140" font-size="26">AR · FR</text>
    <text x="590" y="188" font-size="26">prices in MRU</text>
  </g>

  <rect x="40" y="34" width="196" height="38" rx="19" fill="#FF6FA1" fill-opacity="0.12" stroke="#FF6FA1" stroke-opacity="0.5"/>
  <circle cx="62" cy="53" r="5.5" fill="#FF6FA1">
    <animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="78" y="59.5" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="2" fill="#FFCCDD">E-COMMERCE</text>

  <text x="38" y="152" font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="80" font-weight="800" letter-spacing="-2" fill="url(#title)">Skin Beauty</text>
  <text x="40" y="200" font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="#FFF7FB">Korean skincare store</text>
</g>
<rect x="1" y="1" width="798" height="238" rx="19" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity="0.8"/>
</svg>
